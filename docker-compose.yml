version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dept_management_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: dept_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dept_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: dept_management_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/dept_management?schema=public"
      PORT: 5000
      CLIENT_URL: "http://localhost:5173"
      NODE_ENV: "production"
      JWT_SECRET: "department_management_system_secure_jwt_secret_key_2026"
      JWT_EXPIRES_IN: "7d"
      UPLOAD_DIR: "/app/uploads"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - server_uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: dept_management_client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  postgres_data:
  server_uploads:
